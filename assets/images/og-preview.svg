<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="950" cy="180" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="200" cy="480" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF9248"/>
    </linearGradient>
  </defs>

  <!-- Background Rectangles -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowOrange)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Brand Badge -->
  <rect x="80" y="70" width="340" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="102" cy="90" r="6" fill="#FF6B00"/>
  <text x="120" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARTCODER SISTEMAS</text>

  <!-- Code symbol icon decoration -->
  <g transform="translate(80, 140)">
    <!-- Logo Icon < / > -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#1E293B" stroke="#FF6B00" stroke-width="2"/>
    <path d="M28 50L18 40L28 30" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 30L62 40L52 50" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 26L36 54" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <text x="104" y="55" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Artcoder</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="295" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Engenharia de Software e
  </text>
  <text x="80" y="355" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Soluções Digitais de Alta Performance
  </text>

  <!-- Subtitle -->
  <text x="80" y="420" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Desenvolvimento de plataformas escaláveis, APIs robustas e aplicativos mobile.
  </text>

  <!-- Products pills footer -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 AirsoftHub -->
    <rect x="0" y="0" width="220" height="46" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <circle cx="24" cy="23" r="7" fill="#38BDF8"/>
    <text x="42" y="29" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">AirsoftHub App</text>

    <!-- Pill 2 ProntoOrcei -->
    <rect x="236" y="0" width="210" height="46" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <circle cx="260" cy="23" r="7" fill="#22C55E"/>
    <text x="278" y="29" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">ProntoOrcei</text>

    <!-- Pill 3 Cloud & Mobile -->
    <rect x="462" y="0" width="240" height="46" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <circle cx="486" cy="23" r="7" fill="#F59E0B"/>
    <text x="504" y="29" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Cloud &amp; Microsserviços</text>
  </g>

  <!-- URL watermark -->
  <text x="1120" y="508" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
    artcoder.com.br
  </text>
</svg>
